[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airwallex-erpnext"
version = "1.0.9"
description = "Community Airwallex banking and spend integration for Frappe and ERPNext"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Frappe Airwallex contributors" }]
dependencies = ["tzdata>=2025.2"]

[project.urls]
Homepage = "https://github.com/lutzkind/frappe-airwallex"
Issues = "https://github.com/lutzkind/frappe-airwallex/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["airwallex_erpnext*"]

[tool.pytest.ini_options]
testpaths = ["airwallex_erpnext/tests"]
addopts = "-q"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
