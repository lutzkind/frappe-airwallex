standard_version: 2.4.0
profile: frappe
default_branch: main
self_hosted_labels:
  - self-hosted
  - Linux
  - X64
  - ci
  - isolated
heavy_checks:
  enabled: false
custom_commands:
  setup: 'python -m pip install -e . && python -m pip install --upgrade pip'
  checks: 'python -m compileall -q airwallex_erpnext && ruff check . && python -m build && python -m compileall -q .'
exceptions:
  - 'needs-test-definition: no declared test command'
  - 'application checks delegated to existing PR CI: .github/workflows/ci.yml'
