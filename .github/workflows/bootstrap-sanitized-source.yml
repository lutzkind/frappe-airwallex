name: Bootstrap sanitized standalone source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import audited standalone source
        id: import
        continue-on-error: true
        shell: bash
        env:
          SOURCE_ARTIFACT_URL: "https://productionresultssa9.blob.core.windows.net/actions-results/3bfd420e-297a-4f39-909c-93df3a6d335b/workflow-job-run-79e30fb0-e580-53f1-ac32-8fa8d7312ef9/artifacts/dd0d7b683223136f209b9e80d6d76f8bf5a678e9debd2b99af2791875f83598a.zip?rscd=attachment%3B+filename%3D%22frappe-airwallex-sanitized.zip%22&rsct=application%2Fzip&se=2026-07-24T08%3A18%3A44Z&sig=5INFaB0uJNu%2BDfOMLEumWX6ucDaQTbNFXZUZvsZd3gw%3D&ske=2026-07-24T09%3A54%3A56Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-07-24T05%3A54%3A56Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-07-24T08%3A08%3A39Z&sv=2025-11-05"
          SOURCE_ARTIFACT_SHA256: "92c0b50b9fd65735ba540229f1e05590f237e91de75c412fc8944d3d9998538c"
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/source-artifact"
          source_dir="$RUNNER_TEMP/source"
          mkdir -p "$artifact_dir" "$source_dir"

          curl --fail --location --retry 3 "$SOURCE_ARTIFACT_URL" --output "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$artifact_dir"

          tar_path="$artifact_dir/_temp/frappe-airwallex-sanitized.tar.gz"
          evidence_dir="$artifact_dir/control-center-dashboard/control-center-dashboard/tmp/frappe-airwallex-evidence"
          audit_path="$evidence_dir/sanitized-audit.json"
          checksum_path="$evidence_dir/sanitized-archive.sha256"
          test -f "$tar_path"
          test -f "$audit_path"
          test -f "$checksum_path"
          expected_tar_sha="$(awk '{print $1}' "$checksum_path")"
          echo "$expected_tar_sha  $tar_path" | sha256sum --check --strict
          tar -xzf "$tar_path" -C "$source_dir"

          test "$(cat "$source_dir/airwallex_erpnext/__init__.py")" = '__version__ = "1.0.4"'
          grep -q '^version = "1.0.4"$' "$source_dir/pyproject.toml"
          python3 - "$audit_path" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          if report.get("finding_count") != 0:
              raise SystemExit(f"sanitization findings remain: {report}")
          if report.get("files_scanned", 0) < 100:
              raise SystemExit(f"unexpected scan coverage: {report}")
          PY

          shopt -s dotglob nullglob
          for item in "$source_dir"/*; do
            name="$(basename "$item")"
            if [ "$name" = ".github" ]; then
              continue
            fi
            rm -rf "$name"
            cp -a "$item" .
          done

          rm -f bootstrap-debug.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: publish standalone Frappe Airwallex 1.0.4 source'
          git push origin HEAD:main
