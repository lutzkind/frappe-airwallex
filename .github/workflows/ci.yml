name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ci, isolated]
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Python syntax validation
        run: python -m compileall -q airwallex_erpnext
      - name: Lint
        run: ruff check .
      - name: Unit and fixture tests
        run: pytest
      - name: Package build validation
        run: python -m build
      - name: Clean workspace outputs
        if: always()
        run: rm -rf .pytest_cache .mypy_cache coverage dist build

  secret-scan:
    # GitHub-hosted exception: retain the clean scanning environment and the
    # existing token-backed reporting behavior; fork pull requests are skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frappe-v16-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ci, isolated]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check Frappe v16 source compatibility
        run: |
          frappe_dir="$(mktemp -d "${RUNNER_TEMP}/frappe.XXXXXX")"
          trap 'rm -rf "$frappe_dir"' EXIT
          git clone --depth 1 --branch version-16 https://github.com/frappe/frappe.git "$frappe_dir"
          PYTHONPATH="$frappe_dir:$GITHUB_WORKSPACE" python -m compileall -q airwallex_erpnext
          python - <<'PY'
          import json
          from pathlib import Path
          required = {"Airwallex Settings", "Airwallex Webhook Event", "Airwallex Sync Log"}
          names = {json.loads(path.read_text())["name"] for path in Path("airwallex_erpnext").rglob("*.json") if '"doctype"' in path.read_text()}
          assert required <= names
          PY
