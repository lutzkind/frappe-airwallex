name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  finalize-v1-0-4:
    runs-on: [self-hosted, Linux, X64, ci, isolated]
    steps:
      - name: Finalize tag, release, and discovery metadata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v1.0.4';
            const targetSha = context.sha;
            const topics = [
              'frappe',
              'erpnext',
              'airwallex',
              'banking',
              'accounting',
              'spend-management',
              'payments',
              'fintech',
              'python',
              'open-source',
            ];
            const releaseName = 'Frappe Airwallex v1.0.4';
            const releaseBody = [
              '# Frappe Airwallex v1.0.4',
              '',
              'Initial standalone Release 1 of the unofficial community Airwallex integration for Frappe and ERPNext.',
              '',
              '## Included',
              '',
              '- Banking support for wallet balances and financial-transaction ingestion',
              '- Spend support for corporate-card expenses and receipt attachments',
              '- Bills, supplier payments, reimbursements, transfers, and FX-conversion ingestion where the Airwallex account exposes those capabilities',
              '- Background synchronization on the Frappe long queue, with scheduled recovery and webhook processing',
              '- Existing-data migration and adoption tooling designed to preserve established ERPNext records',
              '- Duplicate prevention, idempotent external identifiers, reconciliation support, and independent posting safeguards',
              '',
              '## Posting safeguards',
              '',
              'Accounting-document creation, accounting-document submission, supplier creation, FX journals, and Airwallex sync-status write-back remain disabled by default. Operators must validate mappings and accounting behavior before enabling any posting control.',
              '',
              '## Receipt compatibility status',
              '',
              'Native and IMAP receipt providers are included. The transitional compatibility receipt endpoint remains available for existing deployments until native receipt parity is tested in production. The related Windmill compatibility scripts must not be removed before that parity is verified.',
              '',
              '## Known limitations',
              '',
              '- Airwallex products, permissions, regions, and API availability vary by account.',
              '- Some supplier-payment, receipt, transfer, reimbursement, and FX representations require account-specific validation.',
              '- Frappe and ERPNext 16 are the supported application versions for this release.',
              '- Airwallex Beta APIs may change without the stability guarantees of generally available APIs.',
              '',
              'This is an unofficial community release. It is not affiliated with or endorsed by Airwallex, Frappe Technologies, or ERPNext. Marketplace approval has not been requested or granted.',
            ].join('\n');

            let tagExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status === 404) tagExists = false;
              else throw error;
            }
            if (tagExists) {
              await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha: targetSha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: targetSha });
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                tag_name: tag,
                target_commitish: targetSha,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: targetSha,
                name: releaseName,
                body: releaseBody,
                draft: false,
                prerelease: false,
              })).data;
            }

            await github.rest.repos.replaceAllRepositoryTopics({ owner, repo, names: topics });

            const tagRef = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
            const verifiedRelease = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            const verifiedTopics = (await github.rest.repos.getAllTopics({ owner, repo })).data.names;
            if (tagRef.object.sha !== targetSha) throw new Error(`tag SHA mismatch: ${tagRef.object.sha}`);
            if (verifiedRelease.name !== releaseName || verifiedRelease.draft || verifiedRelease.prerelease) {
              throw new Error('release metadata verification failed');
            }
            for (const required of topics) {
              if (!verifiedTopics.includes(required)) throw new Error(`missing topic: ${required}`);
            }
            core.summary
              .addHeading('Release verification')
              .addTable([
                [{ data: 'Repository commit', header: true }, targetSha],
                [{ data: 'Tag', header: true }, tag],
                [{ data: 'Tagged commit', header: true }, tagRef.object.sha],
                [{ data: 'Release', header: true }, verifiedRelease.html_url],
                [{ data: 'Topics', header: true }, verifiedTopics.join(', ')],
              ])
              .write();
