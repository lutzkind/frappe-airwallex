name: Release v1.0.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify target commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 650eb1843db3c8600c77c252bbc5671ee732216b
        run: |
          set -euo pipefail
          default_sha="$(gh api repos/${{ github.repository }}/commits/main --jq .sha)"
          test "$default_sha" = "$TARGET_SHA"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.6 \
            --repo "${{ github.repository }}" \
            --target main \
            --title "v1.0.6" \
            --notes "Frappe-managed Airwallex receipts, native Email Account fallback, and removal of the Compatibility API runtime dependency."
