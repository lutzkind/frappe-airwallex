name: Feature request
description: Propose a portable Airwallex/Frappe capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the generic user problem without private data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Idempotency, posting, and migration considerations
      description: Explain stable identifiers, safe defaults, dry run, and rollback.
    validations:
      required: true
